services:
  postgres:
    image: postgres:16-alpine
    container_name: adad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-adad_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adad_secure_password}
      POSTGRES_DB: ${DB_NAME:-adad_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-adad_user} -d ${DB_NAME:-adad_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: adad_postgres_data
